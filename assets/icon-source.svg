<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <!-- pixel critter, scaled from the 16x16 grid (64px per cell), centered -->
  <g fill="#fde68a" shape-rendering="crispEdges">
    <rect x="288" y="256" width="128" height="128"/>
    <rect x="608" y="256" width="128" height="128"/>
    <rect x="256" y="320" width="512" height="448"/>
  </g>
  <g fill="#f59e0b" shape-rendering="crispEdges">
    <rect x="192" y="384" width="64" height="320"/>
    <rect x="768" y="384" width="64" height="320"/>
    <rect x="320" y="768" width="128" height="128"/>
    <rect x="576" y="768" width="128" height="128"/>
  </g>
  <g fill="#1f2937" shape-rendering="crispEdges">
    <rect x="384" y="448" width="64" height="128"/>
    <rect x="576" y="448" width="64" height="128"/>
  </g>
  <rect x="448" y="640" width="128" height="48" rx="24" fill="#1f2937"/>
</svg>
