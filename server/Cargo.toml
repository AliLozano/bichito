[package]
name = "bichito-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bichito-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"

[profile.release]
opt-level = "s"
lto = true
strip = true
