name: server

# Build the WebSocket server image and push it to GHCR on every change to server/.
# Then bump the Pulumi config `bichito:serverImage` (or use :latest) and `pulumi up`.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/alilozano/bichito-server:latest
            ghcr.io/alilozano/bichito-server:${{ github.sha }}

  # Roll out the freshly-built image so it actually goes live (no manual step).
  # Uses the immutable :sha tag so K8s always performs the rollout. To enable:
  #   1) add repo secret  DIGITALOCEAN_TOKEN  (a DO API token)
  #   2) add repo variable AUTODEPLOY = true
  # Skipped by default so the CI stays green until you configure it.
  deploy:
    needs: image
    if: ${{ vars.AUTODEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}
      - run: doctl kubernetes cluster kubeconfig save default-cluster
      - name: Roll out the new image
        run: |
          kubectl set image deployment/bichito-server-app \
            server=ghcr.io/alilozano/bichito-server:${{ github.sha }} -n prod
          kubectl rollout status deployment/bichito-server-app -n prod --timeout=120s
