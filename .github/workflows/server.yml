name: server

# Build the WebSocket server image and push it to GHCR on every change to server/.
# Then bump the Pulumi config `bichito:serverImage` (or use :latest) and `pulumi up`.
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/alilozano/bichito-server:latest
            ghcr.io/alilozano/bichito-server:${{ github.sha }}
